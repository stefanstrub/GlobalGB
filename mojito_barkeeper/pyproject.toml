[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mojito_barkeeper"
version = "0.1.0"
description = "Interactive Mojito L1 data loading, combining, and preprocessing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Stefan Strub" }]
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
mojito-barkeeper-gui = "mojito_barkeeper.gui:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mojito_barkeeper = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]

[dependency-groups]
dev = ["pytest"]
